name: GlitchIdentity
version: ${version}
main: in.ultraop.glitchidentity.paper.GlitchIdentityPaper
api-version: '1.21'
author: UltraOP
description: Animated/corrupted killer identities for death messages.
commands:
  glitch:
    description: Manage GlitchIdentity
    usage: /glitch <add|remove|list|reload|version|help>
    permission: glitchidentity.admin
permissions:
  glitchidentity.admin:
    description: Allows GlitchIdentity commands
    default: op
